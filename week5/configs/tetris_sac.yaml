# SAC 학습 설정 — 테트리스 배치 에이전트.
# 실행:  mlagents-learn configs/tetris_sac.yaml --run-id=tetris_sac_01
# 'Tetris' 키는 Behavior Parameters의 Behavior Name과 반드시 일치해야 한다.
behaviors:
  Tetris:
    trainer_type: sac
    max_steps: 10000000          # 총 학습 스텝 (테트리스는 넉넉히)
    time_horizon: 64
    summary_freq: 20000
    keep_checkpoints: 5

    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant   # SAC 기본(감쇠 X)
      batch_size: 256
      buffer_size: 500000                # off-policy 리플레이 버퍼 — 크게
      buffer_init_steps: 2000            # 학습 전 랜덤 수집 → 초반은 조용한 게 정상
      init_entcoef: 1.0                  # 초기 탐험 강도(α). 이산 40개면 낮춰볼 여지
      tau: 0.005                         # 타깃 네트워크 갱신 속도
      steps_per_update: 10.0             # (에이전트 스텝 : 업데이트) 비율
      save_replay_buffer: true

    network_settings:
      hidden_units: 256
      num_layers: 2
      normalize: false                   # 관측이 0/1·one-hot이라 보통 불필요

    reward_signals:
      extrinsic:
        gamma: 0.99                       # 라인 클리어 같은 지연 보상 → 크게
        strength: 1.0
